name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release tag check
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: API typecheck
        run: npm run api:typecheck

      - name: Web typecheck
        run: npm run web:typecheck

      - name: API tests
        run: npm run api:test

      - name: OpenAPI validation
        run: npm run openapi:validate

      - name: Migration smoke test
        run: npm run migration:smoke

      - name: Staging auth black-box contract
        run: npm run staging:auth-contract

      - name: PostgreSQL backup contract
        run: npm run postgres:backup-contract

      - name: PostgreSQL restore contract
        run: npm run postgres:restore-contract

      - name: Staging load test contract
        run: npm run staging:load-contract

      - name: Release rollback drill contract
        run: npm run release:rollback-contract


      - name: Web production build
        run: npm run web:build
