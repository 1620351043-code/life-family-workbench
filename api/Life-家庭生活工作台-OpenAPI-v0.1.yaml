        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/import-batches:
    get:
      tags: [Finance Import]
      operationId: listImportBatches
      summary: 获取当前家庭最近导入批次
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 最近导入批次
          content:
            application/json:
              schema:
                type: object
                required: [batches]
                properties:
                  batches:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Finance Import]
      operationId: createImportBatch
      summary: 创建账单导入批次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportBatchRequest'
      responses:
        '201':
          description: 导入批次已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/finance/import-batches/{batchId}/upload:
    post:
      tags: [Finance Import]
      operationId: uploadImportBatchFile
      summary: 上传并校验原始账单文件
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 文件已上传并通过大小与 SHA-256 校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/import-batches/{batchId}:
    get:
      tags: [Finance Import]
      operationId: getImportBatch
      summary: 获取导入批次状态
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 导入批次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/import-batches/{batchId}/errors:
    get:
      tags: [Finance Import]
      operationId: listImportBatchErrors
      summary: 获取导入批次问题行
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 问题行及错误码
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row_number, status, error_codes, normalized_payload]
                      properties:
                        row_number: { type: integer }
                        status: { type: string }
                        error_codes:
                          type: array
                          items: { type: string }
                        normalized_payload:
                          type: object
                          additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/import-batches/{batchId}/parse:
    post:
      tags: [Finance Import]
      operationId: parseImportBatch
      summary: 启动隔离账单解析 worker 并写入导入行与来源记录
      description: |
        当前开发阶段使用本地解析 worker 读取已上传对象；生产环境仍需注入
        对象存储适配器。解析结果只写入 import_row/source_record，不直接写入正式账本。
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 解析完成并等待表头确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/import-batches/{batchId}/header-confirmation:
    post:
      tags: [Finance Import]
      operationId: confirmImportHeader
      summary: 确认表头和数据区域
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeaderConfirmation'
      responses:
        '200':
          description: 表头确认后的批次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/finance/import-batches/{batchId}/mapping-confirmation:
    post:
      tags: [Finance Import]
      operationId: confirmImportMapping
      summary: 确认统一字段映射
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldMappingConfirmation'
      responses:
        '200':
          description: 映射确认后的批次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/finance/import-batches/{batchId}/reconciliation:
    get:
      tags: [Finance Import]
      operationId: getImportReconciliation
      summary: 获取重复和跨来源关联候选
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 待确认关联候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'
  /api/finance/import-batches/{batchId}/reconciliation/decisions:
    post:
      tags: [Finance Import]
      operationId: decideImportReconciliation
      summary: 提交重复或跨来源关系决定
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationDecisionRequest'
      responses:
        '200':
          description: 决定保存后的候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCandidate'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/import-batches/{batchId}/commit:
    post:
      tags: [Finance Import]
      operationId: commitImportBatch
      summary: 确认导入并写入正式账本
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitImportRequest'
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/import-batches/{batchId}/revoke:
    post:
      tags: [Finance Import]
      operationId: revokeImportBatch
      summary: 撤销导入产生的正式关系
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 撤销结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: life_session
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PeriodStart:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date
    PeriodEnd:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date
    Granularity:
      name: granularity
      in: query
      schema:
        type: string
        enum: [day, week, month, quarter]
        default: day
    FilterId:
      name: filterId
      in: path
      required: true
      schema:
        type: string
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    BadRequest:
      description: 请求参数或批次状态不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 当前家庭或成员权限不允许访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或不属于当前家庭
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 版本或状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: 外部 AI 或基础设施暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 认证尝试过于频繁；客户端应遵循 Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
    RegisterRequest:
      type: object
      required: [email, password, household_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        household_name:
          type: string
          minLength: 1
          maxLength: 80
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 8
          maxLength: 128
    PasswordResetAccepted:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string
    PasswordResetCompleted:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string
    MeResponse:
      type: object
      required: [user, household]
      properties:
        user:
          $ref: '#/components/schemas/User'
        household:
          $ref: '#/components/schemas/Household'
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    Household:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, adult, child, guest]
    FamilyTopicCard:
      type: object
      required: [id, topic_type, title, body_preview, author_id, author_name, comment_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        topic_type:
          type: string
          enum: [idea, request, inspiration, memory, other]
        title:
          type: string
        body_preview:
          type: string
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
        comment_count:
          type: integer
        created_at:
          type: string
          format: date-time
    FamilyTopicComment:
      type: object
      required: [id, author_id, author_name, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    FamilyTopicDetail:
      allOf:
        - $ref: '#/components/schemas/FamilyTopicCard'
        - type: object
          required: [body, comments]
          properties:
            body:
              type: string
            comments:
              type: array
              items:
                $ref: '#/components/schemas/FamilyTopicComment'
    FamilyTopicListResponse:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/FamilyTopicCard'
    CreateFamilyTopicRequest:
      type: object
      required: [topic_type, title, body]
      properties:
