openapi: 3.1.0
info:
  title: Life 家庭生活工作台 API
  version: 0.1.0
  description: |
    移动端 PWA 首期 API 契约。家庭业务请求从 HttpOnly 会话推导唯一家庭，
    客户端提交的 household_id 不能改变服务端租户上下文。财务金额统一使用
    定点金额字符串；所有摘要、预算环、趋势点和资产成本点返回 drilldown_ref。
servers:
  - url: https://{host}
    variables:
      host:
        default: life.example.com
security:
  - cookieAuth: []
tags:
  - name: Identity
  - name: Family Space
  - name: AI
  - name: Finance Overview
  - name: Finance Import
paths:
  /api/auth/login:
    post:
      tags: [Identity]
      operationId: login
      summary: 使用邮箱和密码创建 HttpOnly 家庭会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；响应同时通过 Set-Cookie 写入 life_session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: 撤销当前 HttpOnly 家庭会话
      security: []
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/auth/register:
    post:
      tags: [Identity]
      operationId: register
      summary: 注册用户并创建唯一家庭
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并创建 owner 会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/password-reset/request:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      summary: 请求单次使用的密码重置链接
      description: 无论邮箱是否存在都返回相同的 202，避免泄露账号存在性。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/password-reset/confirm:
    post:
      tags: [Identity]
      operationId: confirmPasswordReset
      summary: 使用重置令牌更新密码并撤销该用户全部会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: 密码已更新，客户端必须重新登录
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 清除当前 life_session Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCompleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: 获取当前用户和唯一家庭归属
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/finance/overview:
    get:
      tags: [Finance Overview]
      operationId: getFinanceOverview
      summary: 获取财务首页摘要
      parameters:
        - $ref: '#/components/parameters/PeriodStart'
        - $ref: '#/components/parameters/PeriodEnd'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: 财务首页展示模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/accounts:
    get:
      tags: [Finance Overview]
      operationId: listFinanceAccounts
      summary: 获取当前家庭账户及余额
      responses:
        '200':
          description: 账户列表
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinanceAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Finance Overview]
      operationId: createFinanceAccount
      summary: 创建账本账户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinanceAccountRequest'
      responses:
        '201':
          description: 账户已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/accounts/{accountId}:
    patch:
      tags: [Finance Overview]
      operationId: updateFinanceAccount
      summary: 编辑当前家庭账户
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinanceAccountRequest'
      responses:
        '200':
          description: 账户已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/accounts/{accountId}/archive:
    post:
      tags: [Finance Overview]
      operationId: archiveFinanceAccount
      summary: 归档当前家庭账户
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 账户已归档，历史流水保留
          content:
            application/json:
              schema:
                type: object
                required: [account_id]
                properties:
                  account_id:
                    type: string
                    format: uuid
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/categories:
    get:
      tags: [Finance Overview]
      operationId: listFinanceCategories
      summary: 获取记账分类
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [income, expense, transfer]
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinanceCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Finance Overview]
      operationId: createFinanceCategory
      summary: 新增记账分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCategoryWriteRequest'
      responses:
        '201':
          description: 分类已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/categories/{categoryId}:
    patch:
      tags: [Finance Overview]
      operationId: updateFinanceCategory
      summary: 编辑记账分类
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCategoryWriteRequest'
      responses:
        '200':
          description: 分类已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/categories/{categoryId}/archive:
    post:
      tags: [Finance Overview]
      operationId: archiveFinanceCategory
      summary: 归档记账分类
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: 分类已归档，历史账单引用保留
          content:
            application/json:
              schema:
                type: object
                required: [category_id]
                properties:
                  category_id:
                    type: string
                    format: uuid
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/budgets:
    get:
      tags: [Finance Overview]
      operationId: listFinanceBudgets
      summary: 获取周期预算及使用进度
      parameters:
        - $ref: '#/components/parameters/PeriodStart'
        - $ref: '#/components/parameters/PeriodEnd'
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 预算列表
          content:
            application/json:
              schema:
                type: object
                required: [budgets]
                properties:
                  budgets:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinanceBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Finance Overview]
      operationId: createFinanceBudget
      summary: 新增分类预算
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceBudgetWriteRequest'
      responses:
        '201':
          description: 预算已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/permissions:
    get:
      tags: [Finance Permissions]
      operationId: listFinancePermissions
      summary: 获取家庭成员财务权限
      responses:
        '200':
          description: 当前家庭成员的财务授权
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancePermission'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/permissions/{userId}:
    patch:
      tags: [Finance Permissions]
      operationId: updateFinancePermission
      summary: 更新家庭成员财务权限
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePermissionWriteRequest'
      responses:
        '200':
          description: 财务权限已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/permissions/{userId}/revoke:
    post:
      tags: [Finance Permissions]
      operationId: revokeFinancePermission
      summary: 撤销家庭成员全部财务权限
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 权限已撤销
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/audit:
    get:
      tags: [Finance Permissions]
      operationId: listFinanceAudit
      summary: 获取财务授权与关键操作审计
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 审计条目
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinanceAuditEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/exports:
    post:
      tags: [Finance Overview]
      operationId: createFinanceExport
      summary: 创建带审计和有效期的异步账单导出任务
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceExportRequest'
      responses:
        '202':
          description: 导出任务已进入数据库队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceExportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/exports/{exportId}:
    get:
      tags: [Finance Overview]
      operationId: getFinanceExport
      summary: 获取导出任务状态
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 导出任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceExportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/exports/{exportId}/download:
    get:
      tags: [Finance Overview]
      operationId: downloadFinanceExport
      summary: 下载当前家庭的短时有效账单导出
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV 文件或 COS 私有签名下载
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/ai/summary:
    get:
      tags: [Finance AI]
      operationId: getFinanceAiSummary
      summary: 获取带来源引用的财务 AI 摘要与解释
      parameters:
        - $ref: '#/components/parameters/PeriodStart'
        - $ref: '#/components/parameters/PeriodEnd'
      responses:
        '200':
          description: 财务 AI 摘要和待确认提案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAiSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/ai/connection:
    get:
      tags: [Finance AI]
      operationId: getFinanceAiConnection
      summary: 获取当前家庭 AI 连接元数据
      responses:
        '200':
          description: 不包含 API 密钥的家庭 AI 连接
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    allOf:
                      - $ref: '#/components/schemas/FinanceAiConnection'
                    nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Finance AI]
      operationId: upsertFinanceAiConnection
      summary: 家庭所有者更新独立 AI 连接引用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAiConnectionWriteRequest'
      responses:
        '200':
          description: AI 连接已更新
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: '#/components/schemas/FinanceAiConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/finance/ai/connection/test:
    post:
      tags: [Finance AI]
      operationId: testFinanceAiConnection
      summary: 测试当前家庭 AI 连接
      responses:
        '200':
          description: AI 连接测试成功
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: '#/components/schemas/FinanceAiConnection'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/finance/ai/proposals/{proposalId}/decision:
    post:
      tags: [Finance AI]
      operationId: decideFinanceAiProposal
      summary: 确认或拒绝财务 AI 提案
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAiDecisionRequest'
      responses:
        '200':
          description: 提案决策结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAiDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/ai/proposals/{proposalId}/revoke:
    post:
      tags: [Finance AI]
      operationId: revokeFinanceAiProposal
      summary: 撤销财务 AI 提案
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: 提案已撤销
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal:
                    $ref: '#/components/schemas/FinanceAiProposal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/budgets/{budgetId}:
    patch:
      tags: [Finance Overview]
      operationId: updateFinanceBudget
      summary: 调整当前或未来周期预算
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceBudgetWriteRequest'
      responses:
        '200':
          description: 预算已更新，历史账单不被重写
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/budgets/{budgetId}/archive:
    post:
      tags: [Finance Overview]
      operationId: archiveFinanceBudget
      summary: 归档分类预算
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: 预算已归档，历史统计保留
          content:
            application/json:
              schema:
                type: object
                required: [budget_id]
                properties:
                  budget_id:
                    type: string
                    format: uuid
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/finance/assets:
    get:
      tags: [Finance Overview]
      operationId: listFinanceAssets
      summary: 获取家庭实物资产及累计成本
      responses:
        '200':
          description: 资产列表
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinanceAsset'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Finance Overview]
      operationId: createFinanceAsset
      summary: 新增家庭实物资产
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAssetWriteRequest'
      responses:
        '201':
          description: 资产已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAssetDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/finance/assets/{assetId}:
    get:
      tags: [Finance Overview]
      operationId: getFinanceAsset
      summary: 查看资产详情和成本事件
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 资产详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAssetDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Finance Overview]
      operationId: updateFinanceAsset
      summary: 编辑资产名称和类型
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
