        sheets:
          type: array
          items:
            type: object
            required: [preview_rows]
            properties:
              sheet_name:
                type: string
                nullable: true
              header_row:
                type: integer
                nullable: true
              data_start_row:
                type: integer
                nullable: true
              header_score:
                type: integer
              field_mapping:
                type: object
                additionalProperties:
                  type: string
              skipped_rows:
                type: integer
              preview_rows:
                type: array
                items:
                  type: object
                  required: [row_number, values, role]
                  properties:
                    row_number:
                      type: integer
                    values:
                      type: array
                      items:
                        type: string
                    role:
                      type: string
                      enum: [blank, metadata, header, data]
    HeaderConfirmation:
      type: object
      required: [sheet_name, header_row, data_start_row]
      properties:
        sheet_name:
          type: string
        header_row:
          type: integer
          minimum: 1
        data_start_row:
          type: integer
          minimum: 1
        data_end_row:
          type: integer
          minimum: 1
    FieldMappingConfirmation:
      type: object
      required: [mapping, parser_version]
      properties:
        mapping:
          type: object
          additionalProperties:
            type: string
        parser_version:
          type: string
    ReconciliationResponse:
      type: object
      required: [batch_id, candidates, pagination]
      properties:
        batch_id:
          type: string
          format: uuid
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationCandidate'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ReconciliationCandidate:
      type: object
      required: [id, recommended_link_type, status, confidence, reason_codes, records]
      properties:
        id:
          type: string
          format: uuid
        recommended_link_type:
          type: string
          enum: [duplicate, parent_settlement, refund_reversal, fee_related, split, unrelated, pending_review]
        status:
          type: string
          enum: [pending_review, confirmed, rejected, revoked]
        confidence:
          type: number
        reason_codes:
          type: array
          items:
            type: string
        records:
          type: array
          items:
            type: object
            required: [id, source_type, occurred_at, direction, amount]
            properties:
              id:
                type: string
                format: uuid
              source_type:
                type: string
              occurred_at:
                type: string
                format: date-time
              direction:
                type: string
              amount:
                type: string
              merchant_detail:
                type: string
    ReconciliationDecisionRequest:
      type: object
      required: [candidate_id, decision, expected_version]
      properties:
        candidate_id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [duplicate, parent_settlement, refund_reversal, fee_related, split, unrelated]
        expected_version:
          type: integer
        reason:
          type: string
    CommitImportRequest:
      type: object
      required: [expected_version, confirm_summary_hash]
      properties:
        expected_version:
          type: integer
        confirm_summary_hash:
          type: string
    CommitImportResponse:
      type: object
      required: [batch, inserted_transactions, linked_records, pending_records, failed_records]
      properties:
        batch:
          $ref: '#/components/schemas/ImportBatch'
        inserted_transactions:
          type: integer
        linked_records:
          type: integer
        pending_records:
          type: integer
        failed_records:
          type: integer
    ErrorResponse:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1
